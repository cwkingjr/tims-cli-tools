[project]
name = "tims-cli-tools"
version = "0.10.2"
description = "TIMS CLI Tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pandas-stubs>=3.0.0.260204",
    "pydantic>=2.12.5",
    "pytz>=2026.1.post1",
    "rich>=14.3.4",
    "toolz>=1.1.0",
    "types-jsonschema>=4.26.0.20260408",
    "types-openpyxl>=3.1.5.20260408",
    "types-pytz>=2026.1.1.20260408",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
tims_invoice = "tims_cli_tools.tims_invoice:main"
tims_payroll = "tims_cli_tools.tims_payroll:main"

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "genson>=1.3",
    "just>=0.8",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "rust-just>=1.49.0",
    "tprof>=1.2.0",
    "ty>=0.0.29",
]

[tool.ruff]
target-version = "py314"

include = ["src/**.py", "tests/**.py"]
exclude = ["src/before.py"]

lint.select = [
    "B",    # bugbear:    potential bugs
    "DTZ",  # datetimez:  warn about missing timezones
    "F",    # pyflakes:   potential errors
    "FURB", # refurb:     refurbishing and modernizing Python codebases
    "PERF", # perflint:   avoid performance anti-patterns
    "PL",   # pylint:     the oldest static code analyser ( sometimes a bit pedantic)
    "RUF",  # ruff:       rules introduced by ruff
    "S",    # bandit:     security issues
    "SIM",  # simplify:   helps you simplify your code
    "UP",   # pyupgrade:  upgrade syntax or newer versions of the language
]
lint.ignore = [
    "PLR2004", # Magic value used in comparison (column indices, sys.argv checks)
]

[tool.ruff.lint.per-file-ignores]
# Some checks don't make sense in unit tests
"tests/*.py" = [
    "S101",    # Use of `assert` detected
    "S108",    # Probable insecure usage of temporary file or directory
    "PLR0133", # Two constants compared in a comparison, consider replacing `1 == 1`
    "PLR2004", # Magic value used in comparison, consider replacing with a named constant
    "PLC0415", # `import` should be at the top-level of a file
]

[tool.pytest.ini_options]
pythonpath = ["./src"]
testpaths = ["./tests"]

[[tool.mypy.overrides]]
module = "toolz.*"
ignore_missing_imports = true

[tool.uv]
package = true

[tool.ty.terminal]
error-on-warning = true
